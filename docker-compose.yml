version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    # Not exposed externally — only accessible within the backend network

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend
    # Not exposed externally

  service:
    build: ./service
    container_name: task-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongodb
      - redis
    networks:
      - backend
    # Not exposed externally — only reachable via gateway

  gateway:
    build: ./gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:3000"   # Direct gateway access for debugging / Prometheus scraping
    env_file: .env
    environment:
      - SERVICE_URL=http://service:3001
    depends_on:
      - service
    networks:
      - backend
      - frontend

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"   # Main user-facing port
    depends_on:
      - gateway
    networks:
      - frontend

volumes:
  mongo_data:
  redis_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
