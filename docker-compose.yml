version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  service:
    build: ./service
    container_name: task-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongodb
      - redis
    networks:
      - backend

  gateway:
    build: ./gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file: .env
    depends_on:
      - service
    networks:
      - backend
      - frontend

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000" # ← Changed back to 3000
    depends_on:
      - gateway
    networks:
      - frontend

volumes:
  mongo_data:
  redis_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
